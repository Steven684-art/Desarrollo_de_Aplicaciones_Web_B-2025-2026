<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario con Validaciones Dinámicas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Registro de Usuario</h1>
        <form id="userForm">
            <div class="field-group">
                <label for="nombre">Nombre (mín. 3 caracteres):</label>
                <input type="text" id="nombre" name="nombre" required>
                <span class="error-message" id="nombreError"></span>
            </div>

            <div class="field-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required>
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="field-group">
                <label for="password">Contraseña (mín. 8 chars, 1 número, 1 especial):</label>
                <input type="password" id="password" name="password" required>
                <span class="error-message" id="passwordError"></span>
            </div>

            <div class="field-group">
                <label for="confirmPassword">Confirmar Contraseña:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <span class="error-message" id="confirmPasswordError"></span>
            </div>

            <div class="field-group">
                <label for="edad">Edad (≥ 18 años):</label>
                <input type="number" id="edad" name="edad" min="1" required>
                <span class="error-message" id="edadError"></span>
            </div>

            <button type="submit" id="submitBtn" disabled>Enviar</button>
            <button type="button" id="resetBtn">Reiniciar</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
